name: "Ajouter un événement historique"
description: "Proposer un événement pour la carte Autour de l’An Mil"
title: "[Événement] "
labels:
  - "contribution"
  - "événement"
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Merci ! Ce formulaire sert à proposer un nouvel événement historique.
        Après validation, un mainteneur transformera la proposition en fichier JSON.
        Vous n'avez pas besoin de modifier le code de la carte.

  - type: input
    id: year
    attributes:
      label: "Année"
      description: "Année de l'événement, entre 700 et 1400."
      placeholder: "1066"
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: "Titre"
      description: "Titre court affiché sur la carte."
      placeholder: "Bataille de Hastings"
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: "Lieu"
      description: "Nom du lieu."
      placeholder: "Hastings"
    validations:
      required: true

  - type: input
    id: latitude
    attributes:
      label: "Latitude"
      description: "Latitude en degrés décimaux."
      placeholder: "50.91"
    validations:
      required: true

  - type: input
    id: longitude
    attributes:
      label: "Longitude"
      description: "Longitude en degrés décimaux."
      placeholder: "0.49"
    validations:
      required: true

  - type: input
    id: region_id
    attributes:
      label: "Identifiant de région"
      description: "Identifiant correspondant à une région de data/regions.json."
      placeholder: "iles-britanniques"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "Résumé historique destiné aux élèves."
      placeholder: "Décrivez brièvement l'événement et son importance."
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: "Détails"
      description: "Informations complémentaires : contexte, conséquences, acteurs, etc."
    validations:
      required: false

  - type: textarea
    id: sources
    attributes:
      label: "Sources"
      description: "Références bibliographiques ou liens vers des sources fiables."
      placeholder: |
        Auteur, Titre, éditeur, année
        https://...
    validations:
      required: true

  - type: textarea
    id: contributor
    attributes:
      label: "Contributeur"
      description: "Nom ou établissement, si vous souhaitez être crédité."
    validations:
      required: false
