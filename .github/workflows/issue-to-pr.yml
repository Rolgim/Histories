name: Transformer une proposition d'événement en Pull Request

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-event-pr:
    if: contains(github.event.issue.labels.*.name, 'événement')
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Extraire le formulaire
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python scripts/issue_to_event.py

      - name: Valider les données
        run: |
          python -m pip install jsonschema
          python scripts/validate_data.py

      - name: Créer la Pull Request
        id: create_pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Ajout de l'événement #${{ github.event.issue.number }}"
          branch: "contribution/event-${{ github.event.issue.number }}"
          delete-branch: true
          title: "Ajout d'un événement historique — #${{ github.event.issue.number }}"
          body: |
            ## Proposition issue #${{ github.event.issue.number }}

            Cette Pull Request a été générée automatiquement à partir du formulaire GitHub.

            - Issue : #${{ github.event.issue.number }}
            - Auteur de la proposition : @${{ github.event.issue.user.login }}

            ### Contrôles
            - Validation JSON : OK
            - Références de région : OK

            Merci de vérifier le contenu historique et les sources avant fusion.
          labels: "contribution,événement"

      - name: Commenter l'issue
        if: steps.create_pr.outputs.pull-request-number != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = ${{ steps.create_pr.outputs.pull-request-number }};
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Merci ! La proposition a été transformée automatiquement en Pull Request #${pr}. Un mainteneur va maintenant vérifier le contenu historique et les sources.`
            });
