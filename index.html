<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histoires</title>
  <!-- Polices Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=IM+Fell+English&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Ton CSS -->
  <link rel="stylesheet" href="src/styles.css">
  <!-- CSS pour le style médiéval de Leaflet -->
  <style>
    /* Style médiéval pour Leaflet */
    .leaflet-container {
      background: var(--parch1);
      font-family: var(--serif-body);
    }
    .leaflet-bar a {
      background-color: var(--parch2);
      color: var(--ink);
      border: 1px solid var(--gold);
    }
    .leaflet-bar a:hover {
      background-color: var(--parch-dark);
    }
    .leaflet-control-zoom-in,
    .leaflet-control-zoom-out {
      background-color: var(--parch2);
      color: var(--ink-soft);
      border: 1px solid var(--gold);
    }
    .leaflet-control-zoom-in:hover,
    .leaflet-control-zoom-out:hover {
      background-color: var(--parch-dark);
    }
    .leaflet-popup {
      background: var(--parch2);
      color: var(--ink);
      border: 2px solid var(--gold);
      font-family: var(--serif-body);
    }
    .leaflet-popup-content {
      margin: 10px;
    }
    .leaflet-popup-content-wrapper {
      background: transparent;
    }
    /* Cache les attribions Leaflet (optionnel) */
    .leaflet-control-attribution {
      display: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="frame">
      <header>
        <h1>Histoires</h1>
        <p>Chronique cartographiée du monde</p>
      </header>
      <div id="main">
        <!-- Conteneur pour Leaflet -->
        <div id="map-wrap">
          <div id="map" style="height: 100%; width: 100%;"></div>
          <div id="empty-hint">Cliquez sur une région ou un événement pour afficher son contexte.</div>
        </div>
        <aside id="panel">
          <div id="panel-inner">
            <button id="panel-back">← retour à la zone</button>
            <button id="panel-close">✕ fermer</button>
            <div id="panel-body"></div>
          </div>
        </aside>
      </div>
      <div id="timeline">
        <div id="timeline-top">
          <div id="year-display">An <span id="year-num">1000</span></div>
          <button id="play-btn">▶ parcourir 700→1400</button>
        </div>
        <input type="range" id="year-slider" min="700" max="1400" step="5" value="1000">
        <div id="ticks"><span>700</span><span>800</span><span>900</span><span>1000</span><span>1100</span><span>1200</span><span>1300</span><span>1400</span></div>
        <div id="filters">
          <div class="filter-group" id="f-mode">
            <h4>Lire la carte par</h4>
            <div class="chip-row" id="mode-row"></div>
          </div>
          <div class="filter-group" id="f-legend">
            <h4>Légende</h4>
            <div class="chip-row" id="legend-row"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
